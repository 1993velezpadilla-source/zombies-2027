name: Inspect password-protected RAR
on:
  push:
    paths:
      - ".github/workflows/audit-rar-password.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/ghc /usr/local/lib/android/sdk/ndk
          sudo apt-get update -qq
          sudo apt-get install -y -qq 7zip
          python -m pip install -q requests
      - name: Inspect encrypted archive (without extraction)
        env:
          GH_TOKEN: ${{ github.token }}
          RAR_AUDIT_PASSWORD: steamrip.com
        run: python tools/audit_rar_password.py
      - name: Commit generated inventory
        if: always()
        run: |
          if test -f audits/rar-password-inventory.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add audits/rar-password-audit.md audits/rar-password-inventory.json audits/rar-password-7zip-listing.txt
            git commit -m "Store RAR password audit results"
            git push
          fi
